# The pieces a giant word is built from, for the solver (`src/rules/solve/`): a run of `+` strokes
# that is no word the lexicon has is read as prefixes, then one word, then suffixes, each piece
# struck by its sounds (`antidisestablishmentarianism`: anti + dis + establish + ment + arian +
# ism). Each piece is spelled as written and said in ARPAbet, every way it is said; a prefix only
# ever starts a word and a suffix only ever ends one (joined by English spelling, as a suffix
# chord's ending is: `happy` + `ness` is *happiness*). The suffix chords of `rules/suffixes.toml`
# stay the short way to strike the common endings; these are the long ones the chords lack, and
# every ending by its sounds. Only pieces of two syllables, or one syllable of three sounds or
# more, are listed: a shorter one would start or end half the words of the language.

[prefix]
anti = ["AE1 N T IY0", "AE1 N T AY2", "AE2 N T IY0", "AE2 N T AY0"]

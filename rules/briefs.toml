# Both of the above are below this file's own `count` cutoff, so without an explicit `[word]`
# entry neither would be considered for a brief at all (falling through to the rules' own
# full outline — 9-key `STKREUBGT`, 12-key `TKE/SKRAOEUB`). They used to also need a literal
# outline pinned here, not just a source: `matches_real_consonants` only checked the word's
# *first* syllable's onset and *last* syllable's coda, so a cluster belonging to a syllable in
# between was invisible to it. Both words reduce their real first sound (the "d" of
# "district"/"describe") into nothing, which happens to share a key with the next syllable's own,
# unrelated onset cluster ("tr", "skr") — the checker used to mistake that shared key for a
# fragment of the *first* syllable's sound and drop it, when it was never attempting that sound at
# all (`best_brief`'s own `plover` source fell for it: `district` -> `R-T`, dropping a real "t" out
# of "tr"; `describe` -> `SREUB`, dropping a real "k" out of "skr"). Fixed at the root in
# `Rules::explained_elsewhere` (`src/rules.rs`) — a bit already accounted for by some *other*
# syllable's own complete onset or coda no longer counts as a fragment of the one being checked, so
# `plover` above now reaches the correct, whole-cluster outline on its own instead of needing the
# literal pin this used to be.

# The four entries below trade keys for physical comfort (see src/ergonomics.rs), picked by
# scanning the top-1,000-by-frequency words for the worst ergonomic scores and checking each one's
# own Plover candidate list for a different-shaped answer - same mechanism as every brief above,
# a per-word call, not a change to the shared cost function.

# "against": deployed STPWEPBS (score 606) alternates onset row every finger; Plover's own second
# candidate TKPWEPBS (score 448) swaps the leading "ST" for "TK" - same 8 keys, same stroke, no cost
# at all, just a different onset shape Plover already lists. (Scores are src/ergonomics.rs's
# post-keyboard-geometry-revision scale, `cargo run -- ergonomics <outline>` - not the smaller
# numbers an earlier revision of this comment cited.)
against = "TKPWEPBS"

# "protect": deployed PREBGT (score 365, a sandwiched-finger gap on the left hand). Plover's own
# "PHREBGT" (score 302) adds an "H" (7 keys instead of 6) that lets the left index cover both its own
# rows instead of leaving the ring finger gapped between two mismatched neighbors.
protect = "PHREBGT"

# "perhaps": deployed PRAPS (score 433, the same STR/SPR-family onset cost as the structural cases
# below, compounded by its own coda). "PRAPTS" (score 375, 6 keys instead of 5) beats it for the
# same extra key that a "PRAPGS" (score 381, 6 keys) override used to spend here - same coda shape,
# but ending in the right pinky's T/S roll already deployed elsewhere ("lets" -> HRETS) instead of a
# second transition. Found by re-checking this word's full candidate pool after the ergonomics
# keyboard-geometry revision (`cargo run -- ergonomics <outline>`), not by re-deriving from scratch.
perhaps = "PRAPTS"

# "govern": deployed TKPWOFPB (5 keys) drops the "er" sound's own R entirely. Plover's own fuller
# "TKPWOFRPB" (6 keys) keeps it, reading phonetically closer to the actual word - a maintainer
# preference, not an ergonomics or cost finding like the entries above.
govern = "TKPWOFRPB"

# "which": pinned to "KH" again, not for a new cost reason but to undo a real regression the
# ergonomics keyboard-geometry revision's own retuning caused. `which`'s own candidate pool still
# ranks "KH" (2 keys) below only "K" ("can") and "EU" ("I") - both correctly won on raw frequency,
# unrelated to this - but the real, global solve now hands "KH" itself to "charge" instead (a
# genuine Plover-style collision between the two: "charge" lists "KH" as a candidate too), dropping
# `which` to the 3-key "WEU", a real one-key-worse regression caught by
# `the_acceptance_gate_reproduces_or_beats_every_removed_override`. `charge`'s own candidate_cost
# for "KH" didn't change (ergonomics(KH) is one fixed number, charged identically whoever bids for
# it) - this is the global assignment shifting because *other* words' costs moved elsewhere in the
# same solve, not a `which`-specific or `charge`-specific finding. Confirmed by direct before/after
# comparison (`cargo run -- lookup which`/`lookup charge`, pre- vs post-revision binaries): "which"
# held "KH" and "charge" used its own full "KHARPBLG" before this revision.
which = "KH"

# The entry below fixes a real heteronym: a word with more than one CMUdict pronunciation that
# changes *meaning*, where `cheapest()` had settled on the rarer sense's outline - confirmed by
# `explain <word>` against Plover's and Lapwing's own gold dictionaries converging on the other,
# dominant sense (see `docs/decisions.md` for the full 25-word survey this was picked out of; most
# surveyed words were already correct, genuinely ambiguous between two real gold outlines, or not
# actually a sense mismatch at all once `explain` was checked, so are not listed here - including
# "invalid", a near-identical case to "lead" below that was deliberately left unpinned; see
# `docs/decisions.md` for why).

# "lead": deployed HRED is /L EH1 D/, the metal - rare as a bare noun relative to the verb "to
# lead/guide". Both Plover and Lapwing only ever list outlines for the guide sense, /L IY1 D/
# (HRAED, HRAOED) - never the metal sense at all. Pinned to HRAED, the cheaper of the two (5 keys
# vs 6) and already one of this word's own rules-derived candidates, just never winning on cost
# against the metal sense's shorter HRED before this fix. Safe from the stranding problem that
# blocked an otherwise-identical pin for "invalid" (see `docs/decisions.md`): "led" (the past
# tense) already claims HRED, so the metal sense's own first-pronunciation outline is never left
# stranded unclaimed by pinning "lead" away from it.
lead = "HRAED"

# Arbitrary short briefs for a batch of extremely common words, with little or no phonetic
# connection to the word itself - a deliberate, scoped exception to this project's usual
# "exhaustively derivable" ethos (see the Reference, `site/reference/index.json`), chosen on purpose: for a word common
# enough, the time saved by typing one key instead of five or seven beats being able to
# reconstruct it from sound alone. Sourced from an unattributed phrase-briefing cheat sheet that
# was liked on sight, not copied wholesale - each one checked individually against lyk's own real
# candidate pool and the real dictionary's own collisions before being pinned here. Key counts in
# the comments are both sides' real, measured values (`cargo run -- lookup <word>`), not
# estimates; see `docs/decisions.md` for the full before/after.
knew = "-PZ"          # was TKPHAOU, 7 keys -> 2
liked = "-FLD"        # was HRAOEUBGD, 9 keys -> 3
found = "-FBD"        # was TPOUPBD, 7 keys -> 3
believed = "-BLD"     # was PWHREFD, 7 keys -> 3
believe = "-BL"       # was PHREF, 5 keys -> 2
"can't" = "*BG"       # was KAPBTS, 6 keys -> 3
find = "-FPBD"        # was TPAOEUD, 7 keys -> 4
means = "-PLS"        # was PHAOES, 6 keys -> 3
bring = "PWR"         # was PWREU, 5 keys -> 3
thing = "-FRLG"       # was THEUPG, 6 keys -> 4
thought = "-LGT"      # was THAUT, 5 keys -> 3
"wasn't" = "-FSZ"     # was WAEPT, 5 keys -> 3
"weren't" = "*RP"     # was WR-PBT, 5 keys -> 3
"wouldn't" = "*LD"    # was WOPBT, 5 keys -> 3
got = "-GTD"          # was TPWOT, 5 keys -> 3
"couldn't" = "*BGD"   # was KUPBD, 5 keys -> 4
think = "-PBG"        # was THEU, 4 keys -> 3
"doesn't" = "*RBGZ"   # was TKUPBT, 6 keys -> 5

# The `th` family. Every word that begins with the sound of "th" in `they`, `their`, `these`,
# `those` is written with `TH-`, with the vowel telling them apart, so one of them tells you the
# rest. A short bare right-hand chord (`-RPG`, `-FBL`, `-BLS`) saves a key or two but says nothing
# about the word, so these are pinned and nothing generated can move them.
they = "THE"
their = "THAER"
theirs = "THAERS"
these = "THEZ"
those = "THOZ"

# These two also bump another word off the stroke they're pinned to; checked that the bumped
# word has other legal candidates of its own and doesn't go unresolved - see `docs/decisions.md`
# for the real before/after of both.
keep = "KP"  # was KAOEP, 5 keys -> 2; bumps "examine" off this stroke
has = "HA"   # was HAZ, 3 keys -> 2; bumps "ha" off this stroke

# Two words the live steno tape (keymux's own log) shows being reached for by their plain
# phonetic stroke and getting something else: `AOEU` came out as the bare letter "i" or "aye",
# `OE` as "owe", and "oh" itself was typed out letter by letter instead of as its 7-key brief.
# Both lost to rarer words because one extra stroke for the rarer word outweighed any number of
# extra keys for the commoner one, before `STROKE_WEIGHT` became finite (see `site/reference/briefs.json`);
# kept pinned because the tape shows these are the strokes actually reached for.
eye = "AOEU"   # was KWRAOEU, 7 keys -> 4; bumps "aye" off this stroke
oh = "OE"      # was O*ERBGS, 7 keys -> 2; bumps "owe" off this stroke

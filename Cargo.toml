[package]
name = "lyk-steno-theory"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = "2"

# The bar is `cargo clippy --all-targets` with no warnings at all.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unreadable_literal = "allow"
struct_excessive_bools = "allow"

[package]
name = "lyk-steno-theory"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"

[[bin]]
name = "lyk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = "2"
crossterm = "0.29"

# The bar is `cargo clippy --all-targets` with no warnings at all.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unreadable_literal = "allow"
struct_excessive_bools = "allow"
